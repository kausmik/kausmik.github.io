name: GitHub Pages

on:
  push:
    branches:
      - main
      - ci-fix-publish-dir
  # pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
      
      - name: Sphinx Build
        run: |
          cd docs/ && make html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        # If changing the branch from main,
        # also change the `main` in `refs/heads/main`
        # below accordingly.
        if: github.ref == 'refs/heads/ci-fix-publish-dir'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
          force_orphan: true
